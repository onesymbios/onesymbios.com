document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"\u003c!DOCTYPE html>\n\u003chtml>\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"c320d98b-d0ff-492b-8ca4-7434f96c5389\">\u003c/script>\n\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;background:#f6f7fb;}\n  [data-theme=\"light\"]{\n    --bg:#f6f7fb; --bg-rail:#eef0f4; --surface:#ffffff; --surface-2:#eceef4;\n    --border:rgba(7,9,15,0.10); --border-2:rgba(7,9,15,0.12); --border-strong:rgba(7,9,15,0.22);\n    --track:rgba(7,9,15,0.10);\n    --text:#131726; --text-2:#2c3346; --text-3:#454e63; --muted:#5b6479; --muted-2:#9aa1b2;\n    --w-body:400; --w-display:300; --lh-body:1.7;\n  }\n  [data-theme=\"dark\"]{\n    --bg:#07090f; --bg-rail:#0a0c14; --surface:#0d1018; --surface-2:#131726;\n    --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.28);\n    --track:rgba(255,255,255,0.10);\n    --text:#eef0f8; --text-2:#c4c9dc; --text-3:#aeb6cc; --muted:#7a839a; --muted-2:#5d6577;\n    --w-body:300; --w-display:200; --lh-body:1.6;\n  }\n  @keyframes dockIn{from{transform:translateY(14px) scale(0.99);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}\n  @keyframes msgIn{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}\n  ::selection{background:rgba(108,127,255,0.32);}\n  ::-webkit-scrollbar{width:11px;height:11px}\n  ::-webkit-scrollbar-thumb{background:rgba(140,146,160,0.45);border-radius:10px;border:3px solid transparent;background-clip:content-box}\n  ::-webkit-scrollbar-thumb:hover{background:rgba(140,146,160,0.7)}\n\n  /* Example ribbon */\n  .dc-ribbon{position:sticky; top:0; z-index:60; display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; padding:11px 48px; background:var(--surface); border-bottom:1px solid var(--border);}\n  .dc-ribbon-tag{font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#fff; background:linear-gradient(120deg,#6c7fff,#4ecdc4); padding:4px 9px; border-radius:20px; flex:none;}\n  .dc-ribbon-text{font-size:12px; color:var(--muted); flex:1; min-width:140px;}\n  .dc-ribbon-link{font-size:12px; font-weight:600; color:#6c7fff; text-decoration:none; flex:none; white-space:nowrap;}\n  .dc-ribbon-link:hover{text-decoration:underline;}\n  /* Responsive */\n  @media (max-width:820px){\n    .dc-shell{flex-direction:column !important;}\n    .dc-rail{width:100% !important; height:auto !important; position:sticky !important; top:0 !important; z-index:120 !important; flex-direction:column !important; align-items:stretch !important; border-right:none !important; border-bottom:1px solid var(--border) !important;}\n    .dc-rail-top{display:flex !important; align-items:center !important; justify-content:space-between !important;}\n    .dc-rail-brand{padding:14px 16px !important; flex:none !important;}\n    .dc-burger{display:flex !important;}\n    .dc-rail nav{display:none !important;}\n    .dc-rail.is-open nav{display:flex !important; flex-direction:column !important; flex-wrap:nowrap !important; padding:6px 12px 14px !important; gap:2px !important; border-top:1px solid var(--border) !important;}\n    .dc-rail nav button{width:100% !important; white-space:nowrap !important;}\n    .dc-rail-user{display:none !important;}\n    .dc-main{min-width:0 !important;}\n    .dc-content{padding:20px 16px 72px !important; max-width:100% !important;}\n    .dc-ribbon{position:static !important; padding:10px 16px !important;}\n    .dc-grid{grid-template-columns:1fr !important;}\n    .dc-head{flex-wrap:wrap !important; gap:14px !important;}\n    .dc-head h1{font-size:30px !important;}\n    .dc-mompop{right:auto !important; left:0 !important; width:auto !important;}\n  }\n  @media (max-width:480px){\n    .dc-content{padding:16px 12px 64px !important;}\n    .dc-head h1{font-size:24px !important;}\n    .dc-ribbon-text{flex-basis:100% !important;}\n  }\n  .dc-mobile-toprep{display:none;}\n  @media (max-width:820px){\n    .dc-mobile-toprep{display:flex !important; flex-direction:column !important; gap:16px !important; margin-bottom:24px !important;}\n    .dc-rep-bio-card, .dc-rep-quote-card{display:none !important;}\n  }\n\u003c/style>\n\u003c/helmet>\n\u003cdiv data-theme=\"{{ theme }}\" class=\"dc-shell\" style=\"display:flex; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,'Helvetica Neue','Helvetica',Arial,sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  \u003caside class=\"{{ railClass }}\" style=\"width:250px; flex:none; background:var(--bg-rail); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;\">\n    \u003cdiv class=\"dc-rail-top\">\n    \u003cdiv class=\"dc-rail-brand\" onclick=\"{{ goBriefing }}\" style=\"padding:30px 26px 24px; cursor:pointer;\">\n      \u003cdiv style=\"font-size:19px; font-weight:700; letter-spacing:0.04em; color:var(--text);\">SYMBIOS\u003c/div>\n      \u003cdiv style=\"font-size:9.5px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase; color:#ff8c5a; margin-top:8px;\">Representation\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"dc-burger\" onclick=\"{{ toggleMobileNav }}\" aria-label=\"Toggle menu\" style=\"display:none; width:44px; height:44px; margin-right:12px; border:1px solid var(--border-2); background:var(--surface); border-radius:8px; cursor:pointer; align-items:center; justify-content:center; font-size:18px; line-height:1; color:var(--text);\">\u2630\u003c/button>\n    \u003c/div>\n    \u003cnav style=\"flex:1; padding:6px 14px; display:flex; flex-direction:column; gap:1px;\">\n      \u003csc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"7\">\n        \u003cbutton onclick=\"{{ item.onClick }}\" style=\"width:100%; text-align:left; display:flex; align-items:center; gap:11px; padd -ribbon-link\">Return to onesymbios.com &#8594;\u003c/a>\u003c/div>\n    \u003cdiv class=\"dc-content\" style=\"max-width:1180px; width:100%; margin:0 auto; padding:38px 48px 96px;\">\n\n      \u003csc-if value=\"{{ isBriefing }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cdiv class=\"dc-mobile-toprep\">\n          \u003cdiv style=\"background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:18px 20px;\">\n            \u003cdiv style=\"display:flex; align-items:center; gap:14px;\">\n              \u003cdiv style=\"width:56px; height:56px; border-radius:50%; flex:none; position:relative; overflow:hidden; background:#6c7fff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:400;\">A\u003cimg src=\"https://randomuser.me/api/portraits/women/44.jpg\" alt=\"Ari\" onerror=\"this.style.display='none'\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\"/>\u003c/div>\n              \u003cdiv style=\"min-width:0;\">\n                \u003cdiv style=\"font-size:15px; font-weight:600; color:var(--text);\">Ari Delgado\u003c/div>\n                \u003cdiv style=\"font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#ff8c5a; margin-top:3px;\">Your Symbios Rep\u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cp style=\"font-size:12.5px; line-height:1.6; color:var(--muted); margin:13px 0 0; font-weight:var(--w-body);\">A real person \u2014 your single point of contact. Fifteen years representing senior operators and executives, previously a partner at an executive-search firm. Ari negotiates alongside you, opens doors, and keeps your interests moving year-round.\u003c/p>\n            \u003cdiv style=\"display:flex; align-items:center; gap:7px; margin-top:13px;\">\n              \u003cspan style=\"width:7px; height:7px; border-radius:50%; background:#3aa39b; flex:none;\">\u003c/span>\n              \u003cs lor:var(--text);\">{{ activePillar.name }}\u003c/h1>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"dc-grid\" style=\"display:grid; grid-template-columns:1fr; gap:22px; align-items:start; margin-top:26px;\">\n          \u003cdiv style=\"background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:28px 30px;\">\n            \u003cdiv style=\"display:flex; align-items:center; gap:11px; margin-bottom:16px;\">\n              \u003cdiv style=\"width:34px; height:34px; border-radius:50%; flex:none; background:#6c7fff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:400;\">{{ agentInitial }}\u003c/div>\n              \u003cdiv style=\"font-size:13px; font-weight:600; color:var(--text-2);\">{{ agentName }}'s read\u003c/div>\n            \u003c/div>\n            \u003cp style=\"font-size:25px; line-height:1.35; letter-spacing:-0.01em; margin:0 0 22px; color:var(--text); font-weight:var(--w-display);\">{{ activePillar.oneLiner }}\u003c/p>\n\n            \u003csc-if value=\"{{ activePillar.hasGauge }}\">\n              \u003cdiv style=\"margin:0 0 22px; padding:18px 20px; background:var(--surface-2); border:1px solid var(--border); border-radius:7px;\">\n                \u003cdiv style=\"display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:8px;\">\n                  \u003cspan style=\"color:#ff8c5a; font-weight:500;\">You \u00b7 $385k\u003c/span>\n                  \u003cspan>p75 \u00b7 $510k\u003c/span>\n                \u003c/div>\n                \u003cdiv style=\"position:relative; height:11px; border-radius:7px; background:var(--track);\">\n                  \u003cdiv style=\"position:absolute; left:0; top:0; bottom:0; width:68%; background:#ff8c5a; border-radius:7px;\">\u003c/div>\n                  \u003cdiv style=\"position:absolute; left:80%; top:-4px; bottom:-4px; width:2px; background:var(--text); border-radius:2px;\">\u003c/div>\n                \u003c/div>\n                \u003cdiv style=\"display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:9px;\">\n                  \u003cspan>Market median \u003cstrong style=\"color:var(--text); font-weight:600;\">$430k\u003c/strong>\u003c/span>\n                  \u003cspan style=\"color:#ff8c5a; font-weight:600;\">$45k below median\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{ activePillar.hasTrajectory }}\">\n              \u003cdiv style=\"display:flex; align-items:stretch; gap:0; margin:4px 0 8px;\">\n                \u003csc-for list=\"{{ trajectory }}\" as=\"step\" hint-placeholder-count=\"3\">\n                  \u003cdiv style=\"flex:1; position:relative; padding-top:22px;\">\n                    \u003cdiv style=\"position:absolute; top:6px; left:0; right:0; height:2px; background:var(--border-2);\">\u003c/div>\n                    \u003cdiv style=\"position:absolute; top:1px; left:0; width:12px; height:12px; border-radius:50%; background:{{ step.dotColor }}; border:2px solid var(--surface);\">\u003c/div>\n                    \u003cdiv style=\"font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted);\">{{ step.year }}\u003c/div>\n                    \u003cdiv style=\"font-size:14px; font-weight:600; color:{{ step.labelColor }}; margin-top:3px;\">{{ step.label }}\u003c/div>\n                  \u003c/div>\n                \u003c/sc-for>\n              \u003c/div>\n            \u003c/sc-if>\n\n            \u003cdiv style=\"display:flex; flex-direction:column; gap:11px; margin-top:6px;\">\n              \u003csc-for list=\"{{ activePillar.points }}\" as=\"pt\" hint-placeholder-count=\"3\">\n                \u003cdiv style=\"display:flex; gap:11px; align-items:flex-start;\">\n                  \u003cspan style=\"width:6px; height:6px; border-radius:50%; flex:none; margin-top:8px; background:#6c7fff;\">\u003c/span>\n                  \u003cspan style=\"font-size:14.5px; line-height:var(--lh-body); color:var(--text-3); font-weight:var(--w-body);\">{{ pt }}\u003c/span>\n                \u003c/div>\n              \u003c/sc-for>\n            \u003c/div>\n\n            \u003cbutton onclick=\"{{ activePillar.onAction }}\" style=\"margin-top:24px; border:none; cursor:pointer; background:#6c7fff; color:#fff; font-family:inherit; font-size:13.5px; font-weight:500; letter-spacing:0.02em; padding:12px 24px; border-radius:3px;\" style-hover=\"background:#7d8fff;\">{{ activePillar.action }}\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n\n    \u003c/div>\n  \u003c/main>\n\n  \u003cbutton onclick=\"{{ toggleChat }}\" style=\"position:fixed; bottom:26px; right:26px; z-index:40; border:none; cursor:pointer; display:flex; align-items:center; gap:11px; background:#6c7fff; color:#fff; padding:13px 20px 13px 14px; border-radius:30px; box-shadow:0 8px 28px rgba(108,127,255,0.35); font-family:inherit; font-size:14px; font-weight:600;\" style-hover=\"background:#7d8fff;\">\n    \u003cspan style=\"width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:400;\">{{ agentInitial }}\u003c/span>\n    {{ chatButtonLabel }}\n  \u003c/button>\n\n  \u003csc-if value=\"{{ chatOpen }}\">\n    \u003cdiv style=\"position:fixed; bottom:88px; right:26px; z-index:41; width:372px; max-height:560px; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border-2); border-radius:10px; box-shadow:0 18px 50px rgba(7,9,15,0.28); overflow:hidden; animation:dockIn 0.22s ease;\">\n      \u003cdiv style=\"display:flex; align-items:center; gap:11px; padding:15px 18px; border-bottom:1px solid var(--border); background:var(--surface-2);\">\n        \u003cspan style=\"width:34px; height:34px; border-radius:50%; background:#6c7fff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:400; position:relative; overflow:hidden;\">{{ agentInitial }}\u003cimg src=\"https://randomuser.me/api/portraits/women/44.jpg\" alt=\"Ari\" onerror=\"this.style.display='none'\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\"/>\u003c/span>\n        \u003cdiv style=\"flex:1;\">\n          \u003cdiv style=\"font-size:14px; font-weight:600; color:var(--text);\">{{ agentName }}\u003c/div>\n          \u003cdiv style=\"font-size:11.5px; color:#3aa39b; display:flex; align-items:center; gap:5px;\">\u003cspan style=\"width:6px; height:6px; border-radius:50%; background:#4ecdc4;\">\u003c/span>Working with you\u003c/div>\n        \u003c/div>\n        \u003cbutton onclick=\"{{ toggleChat }}\" style=\"border:none; background:transparent; cursor:pointer; font-size:20px; color:var(--muted); padding:4px 8px; line-height:1;\">\u00d7\u003c/button>\n      \u003c/div>\n      \u003cdiv style=\"flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:11px;\">\n        \u003csc-for list=\"{{ chat }}\" as=\"msg\" hint-placeholder-count=\"1\">\n          \u003cdiv style=\"max-width:82%; align-self:{{ msg.selfAlign }}; background:{{ msg.bg }}; color:{{ msg.color }}; padding:10px 14px; border-radius:11px; font-size:13.5px; line-height:1.55; font-weight:{{ msg.weight }}; animation:msgIn 0.2s ease;\">{{ msg.text }}\u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cdiv style=\"padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:9px; align-items:center;\">\n        \u003cinput ref=\"{{ inputRef }}\" onkeydown=\"{{ onKey }}\" placeholder=\"Message {{ agentName }}\u2026\" style=\"flex:1; border:1px solid var(--border-2); border-radius:5px; padding:10px 13px; font-family:inherit; font-size:13.5px; color:var(--text); background:var(--surface-2); outline:none;\">\n        \u003cbutton onclick=\"{{ send }}\" style=\"border:none; cursor:pointer; background:#6c7fff; color:#fff; width:38px; height:38px; flex:none; border-radius:5px; font-size:16px; display:flex; align-items:center; justify-content:center;\">\u2191\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/sc-if>\n\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 860 },\n  &quot;agentName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ari&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Agent&quot; },\n  &quot;showAdvocacy&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Agent&quot; },\n  &quot;userName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;David&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Client&quot; },\n  &quot;userRole&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Chief Financial Officer&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Client&quot; }\n}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.inputRef = React.createRef();\n    let theme = 'light';\n    try { const s = localStorage.getItem('symbios-theme'); if(s==='dark'||s==='light') theme = s; } catch(e){}\n    this.state = {\n      nav: 'briefing',\n      filter: 'all',\n      chatOpen: false,\n      mobileNav: false,\n      momentumHover: false,\n      theme,\n      chat: [\n        { from:'agent', text:`Morning, ${(this.props && this.props.userName ? String(this.props.userName).split(' ')[0] : 'David')}. I pulled three things worth your attention \u2014 start with the Lumen CFO comp move when you're ready.` }\n      ],\n      opps: [\n        { id:'lumen', title:'Chief Financial Officer', company:'Lumen Health', stage:'Series D \u00b7 Health-tech', comp:'$420\u2013470k', equity:'0.6% eq', fit:94, location:'Remote (US)', note:\"They reopened comp after we pushed. You'd build the finance function from zero ahead of a Series E and eventual IPO \u2014 that's the whole role here. $450k+ total is live.\", status:'new', dealStage:2, chip:'Offer in play', tone:'coral' },\n        { id:'brightwave', title:'Chief Financial Officer', company:'Brightwave', stage:'Public \u00b7 Enterprise SaaS', comp:'$480\u2013540k', equity:'+ RSUs', fit:88, location:'Boston / Hybrid', note:\"Board-facing and tied directly to the audit committee \u2014 this is the investor-facing seat you've been building toward. The CEO wants Finance owning the growth narrative.\", status:'new', dealStage:1, chip:'In talks', tone:'teal' },\n        { id:'northpeak', title:'VP Finance & Strategy', company:'Northpeak', stage:'Series C \u00b7 Fintech', comp:'$340\u2013380k', equity:'0.35% eq', fit:80, location:'NYC / Hybrid', note:\"Smaller scope, but they're rebuilding their entire finance stack ahead of a raise \u2014 a strong proof point for the systems side of your story. Worth keeping in the mix.\", status:'new', dealStage:0, chip:'Early talks', tone:'teal' },\n        { id:'orbit', title:'Chief Accounting Officer', company:'Orbit Labs', stage:'Series B \u00b7 AI', comp:'$360\u2013400k', equity:'0.4% eq', fit:73, location:'Remote', note:\"Solid, not special. Controllership for a fast-scaling AI org \u2014 we're keeping it warm as leverage so we negotiate the others from strength.\", status:'watching', dealStage:0, chip:'Tracking', tone:'muted' }\n      ]\n    };\n    this.PILLARS = [\n      { key:'opportunities', symbol:'\u27f3', name:'Opportunity Sourcing', status:'4 opportunities matched this week', accent:'periwinkle' },\n      { key:'compensation', symbol:'\u2191', name:'Compensation Strategy', status:\"You're 10% under market\", accent:'coral',\n        oneLiner:\"You're sitting below the CFO market band. With two C-suite opportunities live, here's the case we'd make together.\",\n        points:[\"Current total comp: $385k\",\"Market median (p50) for CFO at your scale: $430k\",\"Top quartile (p75): $510k\",\"Two board-facing conversations strengthen your leverage today\"],\n        action:'Build my negotiation case', hasGauge:true },\n      { key:'network', symbol:'\u2318', name:'Network Activation', status:'1 warm intro ready', accent:'teal',\n        oneLiner:\"Dana Whitfield just took the CEO chair at Lumen Health. She's hiring her first true CFO \u2014 that's a door we'd open this week, not next.\",\n        points:[\"Dana Whitfield \u2014 CEO, Lumen Health \u00b7 you were finance partners together at Aterra\",\"Lumen is building its finance function from the ground up\",\"Warmth: high \u00b7 you last spoke 5 months ago\"],\n        action:'Draft the intro for me' },\n      { key:'brand', symbol:'\u25c8', name:'Personal Brand', status:'Positioning refresh ready', accent:'violet',\n        oneLiner:\"Right now your story reads 'a finance leader who controls costs.' We can make it 'the operator-CFO who architects growth and the path to IPO.'\",\n        points:[\"New positioning around growth-finance and capital strategy\",\"Two keynote angles: AI in FP&A, and scaling finance through hypergrowth\",\"Recommended: publish your capital-efficiency playbook this quarter\"],\n        action:'Review my positioning' },\n      { key:'leadership', symbol:'\u25c7', name:'Development', status:'2 skills in focus this quarter', accent:'periwinkle',\n        oneLiner:\"Staying sharp is part of the deal. Let's keep your skill set ahead of where the market is heading \u2014 not just your title.\",\n        points:[\"Current focus: investor-relations fluency and board-level strategic storytelling\",\"A stretch project mapped to each skill you're building\",\"Curated learning and a small peer group, refreshed monthly\"],\n        action:'Plan my development' },\n      { key:'strategy', symbol:'\u25ce', name:'Long-Term Planning', status:'On track: Public Co. CFO by 2028', accent:'teal',\n        oneLiner:\"We manage your career capital over time \u2014 capital strategy, systems, leadership, and investor alignment compounding into a public-company CFO seat and, beyond it, a boardroom.\",\n        points:[\"Target: CFO of a public company by 2028\",\"Each move chosen for scope and audit-committee exposure, not just title or pay\",\"Quarterly review keeps the plan honest\"],\n        action:'Open my career plan', hasTrajectory:true }\n    ];\n  }\n\n  componentDidMount(){ this.applyBody(this.state.theme); }\n\n  applyBody(theme){\n    try {\n      const bg = theme==='dark' ? '#07090f' : '#f6f7fb';\n      document.documentElement.style.background = bg;\n      document.body.style.background = bg;\n      document.body.setAttribute('data-theme', theme);\n    } catch(e){}\n  }\n\n  toggleTheme(){\n    this.setState(s=>{\n      const nt = s.theme==='dark' ? 'light' : 'dark';\n      try { localStorage.setItem('symbios-theme', nt); } catch(e){}\n      this.applyBody(nt);\n      return { theme: nt };\n    });\n  }\n\n  computeMomentum(opps){\n    const active = opps.filter(o=>o.status!=='passed');\n    const pursuingCount = opps.filter(o=>o.status==='pursuing').length;\n    // 1. Deal flow \u2014 how far active opportunities have advanced, plus boosts for offers & active pursuit\n    const stageAvg = active.length ? active.reduce((a,o)=>a+(((o.dealStage||0)+1)/4),0)/active.length : 0;\n    const offerBonus = active.some(o=>(o.dealStage||0)>=2) ? 0.12 : 0;\n    const pursuingBoost = Math.min(pursuingCount*0.08, 0.16);\n    const dealSub = Math.max(0, Math.min(stageAvg + offerBonus + pursuingBoost, 1));\n    // 2. Compensation \u2014 live opportunities create negotiating leverage\n    const live = opps.filter(o=>o.status==='new'||o.status==='pursuing').length;\n    const compSub = Math.min(live/4, 1);\n    // 3. Network \u2014 warm intros ready to activate (1 ready)\n    const netSub = 0.8;\n    // 4. Strategy \u2014 adherence to the long-term plan (on track)\n    const stratSub = 0.85;\n    const defs = [\n      { key:'deal',  label:'Deal flow',    weight:40, sub:dealSub,  color:'#6c7fff', detail:`${active.length} opportunit${active.length===1?'y':'ies'} in play${pursuingCount?` \u00b7 ${pursuingCount} pursuing`:''}` },\n      { key:'comp',  label:'Compensation', weight:20, sub:compSub,  color:'#ff8c5a', detail:`${live} live opportunit${live===1?'y':'ies'} = leverage` },\n      { key:'net',   label:'Network',      weight:20, sub:netSub,   color:'#4ecdc4', detail:'1 warm intro ready' },\n      { key:'strat', label:'Strategy',     weight:20, sub:stratSub, color:'#a78bfa', detail:'On track to plan' }\n    ];\n    const parts = defs.map(d=>{ const pts=Math.round(d.sub*d.weight); return { ...d, pts, ptsLabel:`${pts} / ${d.weight}`, subPct:Math.round(d.sub*100) }; });\n    const score = parts.reduce((a,p)=>a+p.pts,0);\n    let band='Stalled', bandColor='#5b6479';\n    if(score>=68){ band='Building'; bandColor='#2c9d94'; }\n    else if(score>=48){ band='Steady'; bandColor='#6c7fff'; }\n    else if(score>=28){ band='Cooling'; bandColor='#ff8c5a'; }\n    const filled = Math.round(score/25);\n    const bars = [6,9,13,16].map((h,i)=>({ h, color: i\u003cfilled ? bandColor : 'var(--track)' }));\n    return { score, band, bandColor, parts, bars };\n  }\n\n  accents(name){\n    if(name==='coral') return { accentText:'#ff8c5a', accentBg:'rgba(255,140,90,0.15)' };\n    if(name==='violet') return { accentText:'#a78bfa', accentBg:'rgba(167,139,250,0.15)' };\n    if(name==='teal') return { accentText:'#4ecdc4', accentBg:'rgba(78,205,196,0.15)' };\n    return { accentText:'#6c7fff', accentBg:'rgba(108,127,255,0.15)' };\n  }\n\n  setNav(k){ this.setState({ nav:k, mobileNav:false }); if(typeof window!=='undefined') try{ window.scrollTo(0,0); }catch(e){} }\n  setFilter(f){ this.setState({ filter:f }); }\n  toggleChat(){ this.setState(s=>({ chatOpen:!s.chatOpen })); }\n  toggleMobileNav(){ this.setState(s=>({ mobileNav:!s.mobileNav })); }\n  openChat(text){ this.setState(s=>({ chatOpen:true, chat: text ? [...s.chat, { from:'agent', text }] : s.chat })); }\n  setOpp(id, status){ this.setState(s=>({ opps:s.opps.map(o=> o.id===id ? {...o, status} : o) })); }\n\n  replyFor(v){\n    const t=(v||'').toLowerCase();\n    if(/comp|salary|money|pay|negoti|worth|package/.test(t)) return \"On comp: you're ~10% under the CFO median. With Lumen and Brightwave both live, we'd anchor at $470k total and hold \u2014 I'll send the one-pager for us to review.\";\n    if(/lumen/.test(t)) return \"Lumen's my top pick too \u2014 Dana wants you specifically. We'll let them know you're engaged and that the package needs to clear $450k. Want the call Thursday?\";\n    if(/brightwave|cfo|board/.test(t)) return \"Brightwave is the board-facing seat. Let's confirm the CFO scope is real \u2014 reporting to the CEO, a seat in the investor and audit-committee reviews \u2014 before we go deeper.\";\n    if(/intro|dana|network|whitfield/.test(t)) return \"I'll draft a warm note to Dana today and run it by you before it goes out. Low-pressure, high-signal.\";\n    if(/pass|not interested|decline|no thanks/.test(t)) return \"Understood \u2014 I'll pass quietly and keep the relationship warm. We never burn a bridge.\";\n    if(/thank/.test(t)) return \"That's the job. I'll keep the board moving.\";\n    if(/brand|positioning|capital|finance.tech/.test(t)) return \"Your positioning refresh is ready \u2014 growth-finance, capital strategy, two keynote angles. I'll drop it in for a quick read.\";\n    return \"Got it. I'll dig in and come back with concrete options \u2014 you'll have something by tomorrow morning.\";\n  }\n  send(){\n    const el=this.inputRef.current;\n    const v=((el&&el.value)||'').trim();\n    if(!v) return;\n    if(el) el.value='';\n    this.setState(s=>({ chat:[...s.chat, { from:'me', text:v }] }));\n    const reply=this.replyFor(v);\n    setTimeout(()=>{ this.setState(s=>({ chat:[...s.chat, { from:'agent', text:reply }] })); }, 650);\n  }\n  onKey(e){ if(e.key==='Enter'){ e.preventDefault(); this.send(); } }\n\n  oppVM(o){\n    const tone={\n      coral:{ bg:'rgba(255,140,90,0.15)', color:'#ff8c5a' },\n      teal:{ bg:'rgba(78,205,196,0.15)', color:'#2c9d94' },\n      periwinkle:{ bg:'rgba(108,127,255,0.15)', color:'#6c7fff' },\n      muted:{ bg:'var(--surface-2)', color:'var(--muted)' }\n    };\n    let chipLabel=o.chip, ct=tone[o.tone||'muted'];\n    if(o.status==='pursuing'){ chipLabel='Pursuing'; ct=tone.periwinkle; }\n    if(o.status==='passed'){ chipLabel='Passed'; ct=tone.muted; }\n    const STAGES=['Sourced','In Talks','Offer','Closing'];\n    const di=o.dealStage||0;\n    const stages=STAGES.map((name,i)=>({\n      name,\n      barBg: i\u003c=di ? '#6c7fff' : 'var(--track)',\n      labelColor: i===di ? 'var(--text)' : (i\u003cdi ? '#6c7fff' : 'var(--muted-2)'),\n      labelWeight: i===di ? '600' : '500'\n    }));\n    return {\n      ...o,\n      chipLabel, chipBg: ct.bg, chipColor: ct.color, stages,\n      isNew:o.status==='new', isWatching:o.status==='watching',\n      isActionable:o.status==='new'||o.status==='watching',\n      isPursuing:o.status==='pursuing', isPassed:o.status==='passed',\n      cardOpacity: o.status==='passed' ? '0.5' : '1',\n      onPursue: ()=> this.setOpp(o.id,'pursuing'),\n      onPass: ()=> this.setOpp(o.id,'passed'),\n      onReconsider: ()=> this.setOpp(o.id,'new'),\n      onDiscuss: ()=> this.openChat(`${o.title} at ${o.company} \u2014 ${o.note} What's your gut telling you?`)\n    };\n  }\n\n  renderVals(){\n    const { nav, filter, chat, chatOpen, opps, theme } = this.state;\n    const isDark = theme==='dark';\n    const agentName = this.props.agentName ?? 'Ari';\n    const agentInitial = (agentName.trim()[0] || 'A').toUpperCase();\n    const userName = this.props.userName ?? 'David';\n    const userRole = this.props.userRole ?? 'Chief Financial Officer';\n    const showAdvocacy = this.props.showAdvocacy ?? true;\n    const pillarKeys=['compensation','network','brand','leadership','strategy'];\n    const isBriefing = nav==='briefing';\n    const isOpps = nav==='opportunities';\n    const isPillar = pillarKeys.indexOf(nav)>=0;\n\n    const mkNav=(key,label,badge)=>{\n      const a = nav===key;\n      return { key, label, badge,\n        bg: a?'rgba(108,127,255,0.12)':'transparent',\n        color: a?'var(--text)':'var(--muted)',\n        weight: a?'600':'400',\n        dot: a?'#6c7fff':'transparent',\n        onClick: ()=> this.setNav(key) };\n    };\n    const navItems=[\n      mkNav('briefing','Briefing'),\n      mkNav('opportunities','Opportunities','4'),\n      mkNav('compensation','Compensation'),\n      mkNav('network','Network','1'),\n      mkNav('brand','Personal Brand'),\n      mkNav('leadership','Development'),\n      mkNav('strategy','Strategy')\n    ];\n\n    const pillars = this.PILLARS.map(p=>({\n      ...p, ...this.accents(p.accent),\n      rowBg: p.key===nav ? 'rgba(108,127,255,0.1)' : 'transparent',\n      onClick: ()=> this.setNav(p.key)\n    }));\n\n    const ack={\n      compensation:\"On it \u2014 you'll have a one-page comp case (you vs CFO p50/p75, with talking points) by tomorrow AM.\",\n      network:\"I'll draft a warm note to Dana today and run it past you before it sends.\",\n      brand:\"Sending your refreshed positioning now \u2014 growth-finance, capital strategy, two keynote angles. Quick read.\",\n      leadership:\"I'll map your next development sprint \u2014 two skills, a stretch project for each, and a check-in \u2014 and send it over.\",\n      strategy:\"Opening your plan \u2014 current trajectory has you at CFO of a public company by 2028. Let's pressure-test it together.\"\n    };\n    const momentum = this.computeMomentum(opps);\n    const found = this.PILLARS.find(p=>p.key===nav);\n    const activePillar = found ? { ...found, ...this.accents(found.accent), onAction: ()=> this.openChat(ack[found.key]) } : {};\n\n    const trajectory=[\n      { year:'Now', label:'CFO', dotColor:'#6c7fff', labelColor:'var(--text)' },\n      { year:'2028', label:'CFO, Public Co.', dotColor:'#ff8c5a', labelColor:'#ff8c5a' },\n      { year:'2031', label:'Board Director (Audit Chair)', dotColor:'#2c9d94', labelColor:'#2c9d94' }\n    ];\n\n    const pushingFor=[\n      { text:'Pressing Lumen to a $450k total package', tag:'leverage: strong', dot:'#6c7fff', tagColor:'#6c7fff', tagBg:'rgba(108,127,255,0.15)' },\n      { text:'Confirming Brightwave is a true board-facing CFO seat', tag:'in progress', dot:'#ff8c5a', tagColor:'#ff8c5a', tagBg:'rgba(255,140,90,0.15)' },\n      { text:'Lining up a warm intro to Dana Whitfield, CEO', tag:'in progress', dot:'var(--muted)', tagColor:'var(--muted)', tagBg:'var(--surface-2)' }\n    ];\n\n    const topOpps = opps.filter(o=>o.status!=='passed').slice(0,2).map(o=>this.oppVM(o));\n    const visibleOpps = opps.filter(o=>{\n      if(filter==='all') return true;\n      if(filter==='new') return o.status==='new'||o.status==='watching';\n      if(filter==='pursuing') return o.status==='pursuing';\n      if(filter==='passed') return o.status==='passed';\n      return true;\n    }).map(o=>this.oppVM(o));\n\n    const mkChip=(key,label)=>{\n      const a=filter===key;\n      return { key, label,\n        bg: a?'#6c7fff':'transparent',\n        color: a?'#fff':'var(--text-3)',\n        border: a?'#6c7fff':'var(--border-2)',\n        onClick: ()=> this.setFilter(key) };\n    };\n    const filterChips=[ mkChip('all','All'), mkChip('new','New'), mkChip('pursuing','Pursuing'), mkChip('passed','Passed') ];\n\n    const chatVM = chat.map(m=>{\n      const me = m.from==='me';\n      return { ...m, me,\n        selfAlign: me?'flex-end':'flex-start',\n        bg: me?'#6c7fff':'var(--surface-2)',\n        color: me?'#fff':'var(--text-2)',\n        weight: me?'400':'var(--w-body)' };\n    });\n\n    return {\n      userName, userRole, dateStr:'Friday, July 3',\n      agentName, agentInitial, showAdvocacy,\n      theme, isDark, isLight: !isDark, toggleTheme: ()=>this.toggleTheme(),\n      momentum, momentumHover: this.state.momentumHover,\n      onMomentumEnter: ()=>this.setState({momentumHover:true}),\n      onMomentumLeave: ()=>this.setState({momentumHover:false}),\n      onMomentumToggle: ()=>this.setState({momentumHover:!this.state.momentumHover}),\n      isBriefing, isOpps, isPillar,\n      navItems, pillars, activePillar, trajectory, pushingFor,\n      topOpps, visibleOpps, filterChips, trackedCount: opps.length,\n      chat: chatVM, chatOpen,\n      chatButtonLabel: chatOpen ? agentName : ('Ask ' + agentName),\n      inputRef:this.inputRef,\n      toggleChat:()=>this.toggleChat(),\n      send:()=>this.send(),\n      onKey:(e)=>this.onKey(e),\n      openReply:()=>this.openChat(),\n      goOpps:()=>this.setNav('opportunities'),\n      goComp:()=>this.setNav('compensation'),\n      goBriefing:()=>this.setNav('briefing'),\n      railClass: this.state.mobileNav ? 'dc-rail is-open' : 'dc-rail',\n      toggleMobileNav:()=>this.toggleMobileNav()\n    };\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"
  </script>
