# onesymbios.com — static site, no build step. Netlify publishes this repo root as-is.
[build]
  publish = "."
  command = ""

# /representation/app/ used to serve a byte-identical copy of the Representation app.
# The copy is gone; the URL still works.
[[redirects]]
  from = "/representation/app/*"
  to = "/representation/"
  status = 301
  force = true
